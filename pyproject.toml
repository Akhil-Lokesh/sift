[project]
name = "sift"
version = "0.1.0"
description = "Cost-aware chat router: joint context-pruning and model choice with prompt-cache cost counted."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "typesafe-sdk",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
